<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="stack-title stack-desc">
  <title id="stack-title">Technical range</title>
  <desc id="stack-desc">Eight tools evidenced across the public repositories: Python, FastAPI and Pydantic, Node.js and Express, GoHighLevel API v2, AWS Lambda, Docker, GitHub Actions, and testing with retries and idempotency.</desc>
  <defs>
    <linearGradient id="stack-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="stack-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stack-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="#0B0F19"/>
  <rect width="1200" height="340" fill="url(#stack-grid)"/>
  <ellipse cx="1000" cy="20" rx="320" ry="200" fill="url(#stack-glow)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#stack-accent)"/>

  <text x="60" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2.4" fill="#C4B5FD">TECHNICAL RANGE</text>
  <text x="60" y="84" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#F8FAFC">The stack behind the systems</text>
  <text x="60" y="108" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">Tools evidenced across the public repositories.</text>
  <text x="1140" y="50" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.6" fill="#64748B">08 TOOLS</text>

