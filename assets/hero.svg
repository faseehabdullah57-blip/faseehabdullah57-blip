<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Faseeh Abdullah — AI Systems Engineer, Automation Architect, Backend Developer</title>
  <desc id="hero-desc">A dark midnight banner with the name, role, and thesis: reliable systems where CRM data, webhooks, and APIs meet.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="#0B0F19"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <ellipse cx="980" cy="40" rx="360" ry="240" fill="url(#glowPurple)"/>
  <ellipse cx="760" cy="380" rx="320" ry="180" fill="url(#glowBlue)"/>
  <ellipse cx="120" cy="330" rx="240" ry="140" fill="url(#glowCyan)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <rect x="72" y="64" width="258" height="30" rx="15" fill="#111827" stroke="#8B5CF6" stroke-opacity="0.7"/>
  <circle cx="90" cy="79" r="3" fill="#22D3EE"/>
  <text x="102" y="83" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#C4B5FD">AI SYSTEMS ENGINEER</text>

  <text x="72" y="152" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#F8FAFC">Faseeh Abdullah</text>
  <text x="72" y="192" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="20" fill="#CBD5E1">Automation Architect · Backend Developer</text>
  <text x="72" y="238" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" fill="#94A3B8">I build reliable systems where CRM data, webhooks,</text>
  <text x="72" y="264" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" fill="#94A3B8">and APIs meet.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.4" fill="#94A3B8">
    <rect x="72" y="300" width="118" height="26" rx="13" fill="#0F172A" stroke="#1F2937"/>
    <text x="90" y="317">IDEMPOTENCY</text>
    <rect x="200" y="300" width="132" height="26" rx="13" fill="#0F172A" stroke="#1F2937"/>
    <text x="218" y="317">OBSERVABILITY</text>
    <rect x="342" y="300" width="118" height="26" rx="13" fill="#0F172A" stroke="#1F2937"/>
    <text x="360" y="317">RELIABILITY</text>
  </g>

  <g transform="translate(930,88)">
    <rect width="180" height="180" rx="36" fill="#0F172A" stroke="url(#accent)" stroke-width="1.5"/>
    <circle cx="90" cy="90" r="58" fill="none" stroke="#1F2937" stroke-dasharray="4 8"/>
    <path d="M90 90 L42 58 M90 90 L138 58 M90 90 L42 122 M90 90 L138 122" stroke="#334155" stroke-width="1"/>
    <circle cx="90" cy="90" r="30" fill="#8B5CF6" fill-opacity="0.08" stroke="#8B5CF6" stroke-opacity="0.3"/>
    <circle cx="90" cy="90" r="12" fill="url(#accent)"/>
    <circle cx="42" cy="58" r="6" fill="#8B5CF6"/>
    <circle cx="138" cy="58" r="6" fill="#3B82F6"/>
    <circle cx="42" cy="122" r="6" fill="#22D3EE"/>
    <circle cx="138" cy="122" r="6" fill="#C4B5FD"/>
    <text x="90" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" letter-spacing="2" fill="#64748B">SYSTEMS / OPERATED</text>
  </g>

  <text x="72" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748B">github.com/faseehabdullah57-blip</text>
  <text x="1128" y="334" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#64748B">SYSTEMS THAT CAN BE OPERATED</text>
</svg>
