<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="signals-title signals-desc">
<title id="signals-title">Repository signals</title>
<desc id="signals-desc">Public repository counts, test and CI coverage, release count, language byte share, and latest public commit date, derived from default branches.</desc>
<defs>
<linearGradient id="signals-accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="0.55" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="bar-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="0.6" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<radialGradient id="signals-glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3B82F6" stop-opacity="0.28"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
<pattern id="signals-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="1" opacity="0.38"/></pattern>
</defs>
<rect width="1200" height="450" fill="#0B0F19"/>
