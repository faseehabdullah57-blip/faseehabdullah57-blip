<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Integration architecture</title>
  <desc id="architecture-desc">Four documented flows: GoHighLevel webhook processing with DLQ and replay, Lambda lead scoring, CSV data migration, and snapshot configuration QA. Shared reliability controls are idempotency, retry with backoff, dead-letter queues, row-level errors, and structured logs.</desc>
  <defs>
    <linearGradient id="arch-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="arch-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="arch-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="1" opacity="0.38"/>
    </pattern>
    <marker id="arch-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1200" height="670" fill="#0B0F19"/>
