  <rect x="0" y="0" width="1200" height="3" fill="url(#arch-accent)"/>

  <text x="60" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2.4" fill="#C4B5FD">SYSTEM DESIGN</text>
  <text x="60" y="84" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#F8FAFC">Integration architecture</text>
  <text x="60" y="108" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">Four services, one reliability model. Drawn from the public repositories' documented flows.</text>
  <text x="1140" y="50" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.6" fill="#64748B">4 FLOWS / 1 MODEL</text>

